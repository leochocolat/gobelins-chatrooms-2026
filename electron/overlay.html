<!doctype html>
<!-- Shown over a chatroom: loading screen, error with retry, and the close button -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000000;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                user-select: none;
            }

            body[data-state='loaded'] {
                background: transparent;
            }

            .panel {
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                max-width: 360px;
                padding: 16px;
                text-align: center;
            }

            body[data-state='loading'] .panel--loading,
            body[data-state='failed'] .panel--failed {
                display: flex;
            }

            .title {
                margin: 0;
                font-size: 17px;
                font-weight: 600;
            }

            .message {
                margin: 0;
                font-size: 14px;
                color: rgba(255, 255, 255, 0.6);
            }

            .spinner {
                width: 32px;
                height: 32px;
                margin-bottom: 4px;
                border: 3px solid rgba(255, 255, 255, 0.2);
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .retry {
                margin-top: 8px;
                padding: 8px 18px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 20px;
                background: rgba(255, 255, 255, 0.1);
                color: inherit;
                font: inherit;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
            }

            /* Dark tint keeps the white cross readable on light pages as well as dark ones */
            .close {
                position: fixed;
                top: 18px;
                left: 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                padding: 0;
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.4);
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
                color: rgba(255, 255, 255, 0.9);
                cursor: pointer;
                transition: background-color 0.15s ease;
            }

            .close:hover {
                background: rgba(0, 0, 0, 0.6);
            }

            .close svg {
                width: 10px;
                height: 10px;
            }

            .retry:focus-visible,
            .close:focus-visible {
                outline: 2px solid #a3ff6e;
                outline-offset: 2px;
            }

            @media (prefers-reduced-motion: reduce) {
                .spinner {
                    animation-duration: 2.4s;
                }
            }
        </style>
    </head>
    <body data-state="loading">
        <div class="panel panel--loading">
            <div class="spinner" aria-hidden="true"></div>
            <p class="title" id="loading-title">Opening chatroom…</p>
        </div>

        <div class="panel panel--failed">
            <p class="title">This page didn't load</p>
            <p class="message" id="error-message"></p>
            <button class="retry" id="retry" type="button">Try again</button>
        </div>

        <button class="close" id="close" type="button" aria-label="Back to chatrooms">
            <svg viewBox="0 0 10 10" aria-hidden="true">
                <path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
        </button>

        <script>
            const name = new URLSearchParams(location.search).get('name');
            if (name) document.getElementById('loading-title').textContent = `Opening ${name}…`;

            document.getElementById('close').addEventListener('click', () => window.overlay.close());
            document.getElementById('retry').addEventListener('click', () => window.overlay.retry());

            window.overlay.onState((state) => {
                document.body.dataset.state = state.name;
                if (state.name === 'failed') document.getElementById('error-message').textContent = state.message;
            });
        </script>
    </body>
</html>
